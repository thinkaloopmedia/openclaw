sources:
  - name: books_to_scrape
    base_url: https://books.toscrape.com
    enabled: true
    schedule: "0 */6 * * *"   # every 6 hours
    fetch_ttl: 3600
    parser: product
    selectors:
      name: "div.product_main h1"
      price: "p.price_color"
      availability: "p.instock.availability"
      description: "div#product_description ~ p"
      image_url: "div.item.active img"
      rating: "p.star-rating|attr:class" # lands in extras; value e.g. "star-rating Three"
      upc: "table.table tr:first-child td"  # lands in extras
    urls:
      - https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html
      - https://books.toscrape.com/catalogue/tipping-the-velvet_999/index.html
      - https://books.toscrape.com/catalogue/soumission_998/index.html
      - https://books.toscrape.com/catalogue/sharp-objects_997/index.html
      - https://books.toscrape.com/catalogue/sapiens-a-brief-history-of-humankind_996/index.html
